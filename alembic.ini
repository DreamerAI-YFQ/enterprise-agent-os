# Alembic configuration for EAOS.
# The actual database URL is read from EAOS_DB__URL in env.py (not from this file)
# so the same config works across environments without edits.

[alembic]
script_location = packages/infra/src/eaos/infra/db/migrations
prepend_sys_path = packages/infra/src
# URL is set programmatically in env.py from EAOS_DB__URL
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
