[project]
name = "eaos-observability"
version = "0.1.0"
description = "EAOS L6 observability: four-granularity trace, five-level drill-down dashboard"
requires-python = ">=3.11,<3.12"
dependencies = [
    "eaos-core",
    "eaos-infra",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eaos"]

[tool.uv.sources]
eaos-core = { workspace = true }
eaos-infra = { workspace = true }
