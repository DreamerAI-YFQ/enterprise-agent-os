[project]
name = "eaos-agent"
version = "0.1.0"
description = "EAOS L4 agent dispatch: LangGraph orchestration, multi-tenant, memory, sandbox, collaboration"
requires-python = ">=3.11,<3.12"
dependencies = [
    "eaos-core",
    "eaos-infra",
    "eaos-data",
    "eaos-knowledge",
    "eaos-skills",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langgraph-checkpoint-postgres>=2.0",
]

[project.optional-dependencies]
docker = ["docker>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eaos"]

[tool.uv.sources]
eaos-core = { workspace = true }
eaos-infra = { workspace = true }
eaos-data = { workspace = true }
eaos-knowledge = { workspace = true }
eaos-skills = { workspace = true }
