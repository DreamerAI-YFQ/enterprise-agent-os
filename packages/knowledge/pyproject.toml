[project]
name = "eaos-knowledge"
version = "0.1.0"
description = "EAOS L2 knowledge engine: ontology, RAG, organizational memory"
requires-python = ">=3.11,<3.12"
dependencies = [
    "eaos-core",
    "eaos-infra",
    "eaos-data",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eaos"]

[tool.uv.sources]
eaos-core = { workspace = true }
eaos-infra = { workspace = true }
eaos-data = { workspace = true }
