[project]
name = "eaos-core"
version = "0.1.0"
description = "EAOS shared kernel: context, errors, config, events, types"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.1",
    "pyjwt>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eaos"]
