[project]
name = "eaos-infra"
version = "0.1.0"
description = "EAOS infrastructure adapters: DB, Redis, LLM, vector store, storage"
requires-python = ">=3.11,<3.12"
dependencies = [
    "eaos-core",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "openai>=1.0",
    "anthropic>=0.30",
    "alembic>=1.13",
    "structlog>=24.1",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "pgvector>=0.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.1",
    "pypdf>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eaos"]

[tool.uv.sources]
eaos-core = { workspace = true }
