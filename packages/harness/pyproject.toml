[project]
name = "eaos-harness"
version = "0.1.0"
description = "EAOS L7 platform-level harness: six governance pillars (core differentiator)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "eaos-core",
    "eaos-infra",
    "eaos-agent",
    "eaos-skills",
    "eaos-data",
    "eaos-knowledge",
    "eaos-observability",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eaos"]

[tool.uv.sources]
eaos-core = { workspace = true }
eaos-infra = { workspace = true }
eaos-agent = { workspace = true }
eaos-skills = { workspace = true }
eaos-data = { workspace = true }
eaos-knowledge = { workspace = true }
eaos-observability = { workspace = true }
