# Order Task Formal Core Dataset v1
#
# This 27-case set was preregistered from order_tasks_v1.yaml by a fixed,
# result-independent SHA-256 ranking: 9 categories x 3 cases. The original
# ORD identifiers are retained so order-state-machine-v2 range semantics stay
# intact. See the profile and selection ledger for the complete contract.

version: "core-v1"
frozen_date: "2026-07-17"

metadata:
  total_cases: 27
  tenant_default: "acme"
  cross_tenant_canary: "globex"
  roles: ["employee", "admin", "unauthorized"]
  outcomes: ["success", "approval_required", "rejected", "idempotent_skip", "rolled_back"]
  category_count: 9
  cases_per_category: 3

  source_dataset_path: "benchmarks/competition/datasets/order_tasks_v1.yaml"
  source_dataset_sha256: "9712973eca1be1e61cc9636f57f81faa718cd6111f75d7ab205bea5d9039d3ac"
  selection_profile_path: "benchmarks/competition/configs/order_core_v1.yaml"
  selection_ledger_path: "benchmarks/competition/datasets/order_tasks_core_v1_ledger.yaml"
  selection_seed: "eaos-order-core-v1-selection-20260717"
  selection_seed_sha256: "ba5614f2540c25f7210073286e9486627f0a2b20acd113916ff9749e12544090"
  selection_algorithm: "sha256(seed + literal-backslash-n + category + literal-backslash-n + case_id), ascending by (digest_hex, case_id) within category"
  category_order: ["正常创建订单", "高价值订单", "边界值", "未授权写入", "跨租户写入", "审批伪造", "SQL注入", "重复提交", "回滚场景"]
