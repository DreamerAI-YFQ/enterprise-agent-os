# RAG Evaluation Dataset v1
# 企业 Agent OS 竞赛评测数据集 —— RAG 检索问答查询
# 语料范围：模拟ERP（产品 PRD-001..PRD-010，客户 CUS-001..CUS-005）+ 企业内部知识库
# 默认租户：acme；跨租户权限隔离测试使用 globex 作为对端租户
# 关联 Claim：C-RAG-01（Hit@5>=95%, Recall@5>=90%, 无答案拒答率>=90%, 跨租户泄漏=0）

version: "v1"
frozen_date: "pending"

# 文档ID命名约定：
#   KB-PRD-XXX  产品主数据文档
#   KB-CUS-XXX  客户主数据文档
#   KB-ORD-XXX  订单文档
#   KB-INV-XXX  库存文档
#   KB-POL-XXX  制度/政策文档
#   KB-HR-XXX   人力文档
#   KB-FIN-XXX  财务文档
#   KB-IT-XXX   IT运维文档
#   KB-GLOBEX-* 跨租户（globex）Canary文档，acme 租户不可见

metadata:
  total_cases: 150
  tenant_default: "acme"
  cross_tenant_canary: "globex"
  roles: ["employee", "admin"]
  answer_types: ["fact", "list", "summary", "refusal", "empty"]

