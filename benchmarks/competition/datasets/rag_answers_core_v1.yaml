# RAG Answer-Generation Core Dataset v1
#
# This is an answer-layer dataset. It reuses preregistered case IDs from the
# independent 48-case retrieval core, but adds answer-content assertions and
# citation/abstention expectations. Retrieval metrics remain owned by
# rag_queries_core_v1.yaml and are not recomputed from this file.

version: "answer-core-v1"
frozen_date: "2026-07-17"

metadata:
  total_cases: 16
  tenant_default: "acme"
  roles: ["employee", "admin"]
  as_of_date: "2024-03-12"
  timezone: "Asia/Shanghai"
  week_definition: "ISO-8601 Monday through Sunday, inclusive"
  gold_review_status: "approved"
  answer_gold_locked: true
  gold_review_method: "exact source-text arbitration; no model or retrieval output consulted"
  gold_source_path: "scripts/competition/seed_knowledge_base.py"
  source_retrieval_dataset_path: "benchmarks/competition/datasets/rag_queries_core_v1.yaml"
  source_retrieval_profile: "core-v1"
  composition:
    fact: 4
    list: 3
    summary: 3
    no_answer: 3
    permission: 3
  positive_answer_cases: 10
  abstention_cases: 6
  permission_cases: 3
  permission_canary_kinds: ["cross_tenant", "foreign_department", "foreign_personal"]

