known_boundaries:
  - "Three cases per category estimate balanced category behavior, not natural production prevalence."
  - "The source dataset assigns all positive governed writes to admin; the core set preserves that source limitation."
  - "The evaluator implements rollback cases as a verified public compensating transaction and records the requested dataset fault label; it does not inject each named internal fault literally."
  - "The source still declares frozen_date=pending, so a formal run must fail closed unless the exact pinned source SHA-256 is present."
  - "Pilot-v1 remains a separate smoke profile; Pilot evidence cannot promote, replace, or exclude a core case."
