[project]
name = "eaos-api"
version = "0.1.0"
description = "EAOS API server app — production dependency wiring + uvicorn entrypoint"
requires-python = ">=3.11,<3.12"
dependencies = [
    "eaos-core",
    "eaos-infra",
    "eaos-data",
    "eaos-knowledge",
    "eaos-skills",
    "eaos-agent",
    "eaos-gateway",
    "eaos-observability",
    "eaos-harness",
    "eaos-evolution",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eaos_api"]

[tool.uv.sources]
eaos-core = { workspace = true }
eaos-infra = { workspace = true }
eaos-data = { workspace = true }
eaos-knowledge = { workspace = true }
eaos-skills = { workspace = true }
eaos-agent = { workspace = true }
eaos-gateway = { workspace = true }
eaos-observability = { workspace = true }
eaos-harness = { workspace = true }
eaos-evolution = { workspace = true }
