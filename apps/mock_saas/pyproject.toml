[project]
name = "mock-saas"
version = "0.1.0"
description = "Simulated ERP/CRM SaaS service with REST API and MCP server wrapper — dev/test/demo target for EAOS Phase 7"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "mcp>=1.0",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "pydantic>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_saas"]
