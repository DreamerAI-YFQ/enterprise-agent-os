[project]
name = "eaos-worker"
version = "0.1.0"
description = "EAOS evolution worker process — polls and advances the six-step governance pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
    "eaos-core",
    "eaos-api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eaos_worker"]

[tool.uv.sources]
eaos-core = { workspace = true }
eaos-api = { workspace = true }
